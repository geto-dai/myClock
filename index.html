<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="時計">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>スタンバイ時計</title>
<style>
  :root {
    --fg: #f5f5f5;
    --sub: rgba(245, 245, 245, 0.55);
    --bg: #000;
    --panel: rgba(28, 28, 30, 0.94);
    --line: rgba(255, 255, 255, 0.12);
    --accent: #0a84ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 1.5s ease, padding-right 0.4s ease;
  }
  /* Width the clock may use: whole screen, or the part left of the settings panel */
  body { --avail: 100vw; }
  body.panel-open {
    --panel-space: calc(min(360px, 100vw - 32px) + 32px + env(safe-area-inset-right));
    --avail: calc(100vw - var(--panel-space));
  }
  body.panel-open #stage { padding-right: var(--panel-space); }
  #clock {
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 3s ease;
  }
  #time {
    font-weight: 200;
    font-size: min(calc(var(--avail) * 0.3), 62vh);
    transition: font-size 0.4s ease;
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: baseline;
  }
  #time .colon { padding: 0 0.02em; position: relative; top: -0.06em; }
  #time .colon.blink { animation: blink 2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  #ampm { font-size: 0.18em; font-weight: 400; margin-left: 0.25em; color: var(--sub); }
  #sec { font-size: 0.3em; font-weight: 300; margin-left: 0.15em; color: var(--sub); }
  #date {
    margin-top: min(2vw, 3vh);
    font-size: min(calc(var(--avail) * 0.042), 7vh);
    transition: font-size 0.4s ease;
    font-weight: 300;
    color: var(--sub);
    letter-spacing: 0.04em;
  }
  .hidden { display: none !important; }

  #hint {
    position: fixed;
    bottom: max(16px, env(safe-area-inset-bottom));
    left: 0; right: 0;
    text-align: center;
    font-size: 14px;
    color: rgba(255,255,255,0.35);
    transition: opacity 1s;
    pointer-events: none;
  }

  #panel {
    position: fixed;
    right: max(16px, env(safe-area-inset-right));
    top: max(16px, env(safe-area-inset-top));
    width: min(360px, calc(100vw - 32px));
    /* Fit inside the area the iPad really shows (status bar / home indicator excluded) */
    max-height: calc(100vh - 32px);
    max-height: calc(100dvh - max(16px, env(safe-area-inset-top)) - max(16px, env(safe-area-inset-bottom)));
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 8px 16px 16px;
    color: #f5f5f5;
    font-size: 16px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  #panel h2 { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.5); margin: 14px 0 6px; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    gap: 12px;
  }
  .row:last-child { border-bottom: none; }
  .row input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
  .row input[type=range] { flex: 1; max-width: 170px; accent-color: var(--accent); }
  .row select, .row input[type=time] {
    background: rgba(255,255,255,0.08);
    color: #f5f5f5;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 15px;
  }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .swatch {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.6);
  }
  .swatch.on { border-color: #fff; }
  #bgSwatches .swatch:not(.custom) { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35); }
  .swatch.custom {
    position: relative; overflow: hidden;
    background: conic-gradient(#ff6b6b, #ffd166, #9fe8c9, #a8d4ff, #c9a8ff, #ff6b6b);
  }
  .swatch.custom input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer; border: none;
  }
  /* Many fonts: 3 columns in their own scroll box */
  .fonts {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 8px 4px 8px 0;
    max-height: 300px; overflow-y: auto; overscroll-behavior: contain; position: relative;
  }
  .break { flex-basis: 100%; height: 0; }
  .btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .btns .sub-btn { margin-top: 0; padding: 10px 4px; font-size: 13px; }
  .font {
    background: rgba(255,255,255,0.06); border: 2px solid transparent; border-radius: 10px;
    padding: 8px 6px 6px; text-align: center; cursor: pointer; color: #f5f5f5;
  }
  .font.on { border-color: var(--accent); background: rgba(10,132,255,0.15); }
  .font { min-width: 0; padding: 6px 2px 4px; }
  .font b { display: block; font-size: 20px; font-weight: 400; line-height: 1.3; white-space: nowrap; overflow: hidden; }
  .font small {
    display: block; font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 2px;
    font-family: -apple-system, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #close {
    width: 100%; margin-top: 14px; padding: 12px;
    border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 600;
  }
  #update, .sub-btn {
    width: 100%; margin-top: 8px; padding: 10px;
    border: 1px solid var(--line); border-radius: 10px;
    background: rgba(255,255,255,0.08); color: #f5f5f5; font-size: 15px;
  }
  #version { font-size: 12px; color: rgba(255,255,255,0.35); margin-top: 4px; padding-bottom: 4px; }
  #status { font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
<div id="stage">
  <div id="clock">
    <div id="time"><span id="hh">00</span><span class="colon" id="colon">:</span><span id="mm">00</span><span id="sec">00</span><span id="ampm">AM</span></div>
    <div id="date"></div>
  </div>
</div>
<div id="hint">タップで設定</div>

<div id="panel" class="hidden">
  <h2>表示</h2>
  <div class="row"><label for="o24">24時間表示</label><input type="checkbox" id="o24"></div>
  <div class="row"><label for="oSec">秒を表示</label><input type="checkbox" id="oSec"></div>
  <div class="row"><label for="oBlink">コロンを点滅</label><input type="checkbox" id="oBlink"></div>
  <div class="row"><label for="oDate">日付を表示</label><input type="checkbox" id="oDate"></div>
  <div class="row"><label for="oWeight">数字の太さ</label>
    <select id="oWeight"><option value="100">極細</option><option value="200">細</option><option value="400">標準</option><option value="600">太</option></select>
  </div>
  <h2>フォント</h2>
  <div class="fonts" id="fonts"></div>
  <button id="randomFont" class="sub-btn">🎲 フォントをランダムに</button>
  <h2>文字色</h2>
  <div class="swatches" id="swatches"></div>
  <h2>背景色</h2>
  <div class="swatches" id="bgSwatches"></div>
  <h2>色をランダムに</h2>
  <div class="btns">
    <button class="sub-btn" data-mode="dark">🌙 暗い背景</button>
    <button class="sub-btn" data-mode="light">☀️ 明るい背景</button>
    <button class="sub-btn" data-mode="any">🎲 おまかせ</button>
  </div>
  <h2>画面</h2>
  <div class="row"><label for="oBright">明るさ</label><input type="range" id="oBright" min="10" max="100"></div>
  <h2>夜間モード</h2>
  <div class="row"><label for="oNight">夜は暗く赤くする</label><input type="checkbox" id="oNight"></div>
  <div class="row"><label for="oNightFrom">開始</label><input type="time" id="oNightFrom"></div>
  <div class="row"><label for="oNightTo">終了</label><input type="time" id="oNightTo"></div>
  <button id="close">閉じる</button>
  <button id="update">最新版に更新</button>
  <div id="status"></div>
  <div id="version"></div>
</div>

<script>
(() => {
  // Color presets, grouped (each group starts a new line in the panel)
  const LIGHT_INKS = [
    '#ffffff', '#f5f5f5', '#d9d9d9', '#fff3d6', '#ffe5b4', '#ffd9a0', '#ffb347', '#ffd166',
    '#f4f1a0', '#c5f27a', '#9fe8c9', '#b8f2e6', '#5ce1e6', '#a8d4ff', '#7aa2ff', '#e6e6fa',
    '#c9a8ff', '#ffe0e9', '#ff9ecb', '#ff6b6b'
  ];
  const DARK_INKS = [
    '#000000', '#1c1c1e', '#3a3a3c', '#5c5c5e', '#14213d', '#1d3557', '#003049', '#0f4c5c',
    '#0b3d2e', '#264d00', '#4a5d23', '#3c096c', '#4a1c40', '#6a040f', '#7a0019', '#9d0208',
    '#5c2a0c', '#8a4b00', '#7f5539', '#b5179e'
  ];
  const DARK_BGS = [
    '#000000', '#0a0a0a', '#1c1c1e', '#2b2d42', '#0b1a2e', '#14213d', '#1b263b', '#001219',
    '#12343b', '#0f2027', '#0d2a1f', '#132a13', '#1f1033', '#22223b', '#2d1e2f', '#3a0d14',
    '#3c1518', '#2a1508'
  ];
  const LIGHT_BGS = [
    '#ffffff', '#f5f5f5', '#e5e5e5', '#f5f0e6', '#fff8dc', '#fef3c7', '#fce1c8', '#ffd6a5',
    '#fde2e4', '#fbcfe8', '#f3e8ff', '#ede9fe', '#dbeafe', '#e0f2fe', '#d1fae5', '#e2f0cb',
    '#ecfccb', '#cfe8e3'
  ];
  const COLORS = [LIGHT_INKS, DARK_INKS];
  const BGS = [DARK_BGS, LIGHT_BGS];
  // Fonts: [label, CSS font-family, Google Fonts spec (only for web fonts)]
  // Keep the order — the chosen font is saved by its position. Add new ones at the end.
  const FONTS = [
    ['システム', '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'],
    ['丸ゴシック', 'ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", sans-serif'],
    ['セリフ', 'ui-serif, "New York", Georgia, serif'],
    ['等幅', 'ui-monospace, "SF Mono", Menlo, Consolas, monospace'],
    ['Avenir Next', '"Avenir Next", Avenir, sans-serif'],
    ['Futura', 'Futura, "Century Gothic", sans-serif'],
    ['Helvetica', '"Helvetica Neue", Helvetica, Arial, sans-serif'],
    ['Gill Sans', '"Gill Sans", "Gill Sans MT", sans-serif'],
    ['Optima', 'Optima, Candara, sans-serif'],
    ['Didot', 'Didot, "Bodoni 72", "Bodoni MT", serif'],
    ['Baskerville', 'Baskerville, "Baskerville Old Face", serif'],
    ['明朝', '"Hiragino Mincho ProN", "Yu Mincho", serif'],
    ['タイプライター', '"American Typewriter", "Courier New", monospace'],
    ['手書き', 'Noteworthy, "Marker Felt", "Comic Sans MS", cursive'],
    // --- more fonts built into iPadOS ---
    ['角ゴシック', '"Hiragino Sans", "Yu Gothic", sans-serif'],
    ['Arial Rounded', '"Arial Rounded MT Bold", "Arial Rounded MT", sans-serif'],
    ['Trebuchet', '"Trebuchet MS", sans-serif'],
    ['Verdana', 'Verdana, sans-serif'],
    ['Georgia', 'Georgia, serif'],
    ['Palatino', 'Palatino, "Palatino Linotype", serif'],
    ['Hoefler Text', '"Hoefler Text", Garamond, serif'],
    ['Iowan', '"Iowan Old Style", "Book Antiqua", serif'],
    ['Charter', 'Charter, "Bitstream Charter", Cambria, serif'],
    ['Cochin', 'Cochin, Constantia, serif'],
    ['Bodoni', '"Bodoni 72", "Bodoni MT", serif'],
    ['Copperplate', 'Copperplate, "Copperplate Gothic Light", serif'],
    ['Rockwell', 'Rockwell, "Rockwell Nova", serif'],
    ['Superclarendon', 'Superclarendon, Rockwell, serif'],
    ['Chalkduster', 'Chalkduster, "Segoe Print", cursive'],
    ['Bradley Hand', '"Bradley Hand", "Segoe Script", cursive'],
    ['Snell', '"Snell Roundhand", "Segoe Script", cursive'],
    ['Marker Felt', '"Marker Felt", "Comic Sans MS", cursive'],
    ['Papyrus', 'Papyrus, fantasy'],
    ['Party', '"Party LET", "Segoe Print", cursive'],
    // --- web fonts (Google Fonts; only digits and date characters are downloaded) ---
    ['Orbitron', 'Orbitron, sans-serif', 'Orbitron:wght@400..900'],
    ['Audiowide', 'Audiowide, sans-serif', 'Audiowide'],
    ['Share Tech', '"Share Tech Mono", monospace', 'Share+Tech+Mono'],
    ['VT323', 'VT323, monospace', 'VT323'],
    ['Press Start', '"Press Start 2P", monospace', 'Press+Start+2P'],
    ['Silkscreen', 'Silkscreen, monospace', 'Silkscreen'],
    ['Major Mono', '"Major Mono Display", monospace', 'Major+Mono+Display'],
    ['Bebas Neue', '"Bebas Neue", sans-serif', 'Bebas+Neue'],
    ['Righteous', 'Righteous, sans-serif', 'Righteous'],
    ['Monoton', 'Monoton, sans-serif', 'Monoton'],
    ['Josefin Sans', '"Josefin Sans", sans-serif', 'Josefin+Sans:wght@100..700'],
    ['Quicksand', 'Quicksand, sans-serif', 'Quicksand:wght@300..700'],
    ['Comfortaa', 'Comfortaa, sans-serif', 'Comfortaa:wght@300..700'],
    ['Fredoka', 'Fredoka, sans-serif', 'Fredoka:wght@300..700'],
    ['Poiret One', '"Poiret One", sans-serif', 'Poiret+One'],
    ['Playfair', '"Playfair Display", serif', 'Playfair+Display:wght@400..900'],
    ['Abril Fatface', '"Abril Fatface", serif', 'Abril+Fatface'],
    ['Lobster', 'Lobster, cursive', 'Lobster'],
    ['Pacifico', 'Pacifico, cursive', 'Pacifico'],
    ['Caveat', 'Caveat, cursive', 'Caveat:wght@400..700'],
    ['Zen丸ゴシック', '"Zen Maru Gothic", sans-serif', 'Zen+Maru+Gothic:wght@300;400;500;700'],
    ['Dela Gothic', '"Dela Gothic One", sans-serif', 'Dela+Gothic+One'],
    ['ドット', 'DotGothic16, monospace', 'DotGothic16'],
    ['ランパート', '"Rampart One", sans-serif', 'Rampart+One'],
    ['レゲエ', '"Reggae One", sans-serif', 'Reggae+One'],
    ['トレイン', '"Train One", sans-serif', 'Train+One'],
    ['解星デコール', '"Kaisei Decol", serif', 'Kaisei+Decol'],
    ['油性マジック', '"Yusei Magic", sans-serif', 'Yusei+Magic'],
  ];
  // Load all web fonts in one request, limited to the characters the clock shows
  {
    const specs = FONTS.filter(f => f[2]).map(f => 'family=' + f[2]).join('&');
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?' + specs +
      '&text=' + encodeURIComponent('0123456789:AMP月日火水木金土（）') + '&display=swap';
    document.head.appendChild(link);
  }
  const DEFAULTS = {
    h24: true, sec: false, blink: true, date: true, weight: '200',
    color: '#f5f5f5', bg: '#000000', bright: 100, font: 0,
    night: true, nightFrom: '22:00', nightTo: '06:00'
  };
  const KEY = 'standby-clock-settings';
  // MAJOR.MINOR.PATCH — bump on every change so open clocks reload themselves
  //   MAJOR: big redesign / MINOR: new feature / PATCH: fix or small tweak
  const VERSION = '1.5.0';

  let s = { ...DEFAULTS };
  try { Object.assign(s, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} };

  const $ = id => document.getElementById(id);
  const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
  const pad = n => String(n).padStart(2, '0');

  // --- Night mode ---
  const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  function isNight(now) {
    if (!s.night) return false;
    const cur = now.getHours() * 60 + now.getMinutes();
    const from = toMin(s.nightFrom), to = toMin(s.nightTo);
    return from <= to ? (cur >= from && cur < to) : (cur >= from || cur < to);
  }

  // --- Render ---
  function applyStyle(now) {
    const night = isNight(now);
    document.documentElement.style.setProperty('--fg', night ? '#ff3b30' : s.color);
    document.documentElement.style.setProperty('--sub', night ? 'rgba(255,59,48,0.6)' : hexA(s.color, 0.55));
    $('stage').style.opacity = night ? Math.min(s.bright, 35) / 100 : s.bright / 100;
    // Background lives on the stage so the brightness slider dims it too; black at night
    $('stage').style.background = night ? '#000' : s.bg;
    $('time').style.fontWeight = s.weight;
    $('clock').style.fontFamily = (FONTS[s.font] || FONTS[0])[1];
    $('sec').classList.toggle('hidden', !s.sec);
    $('ampm').classList.toggle('hidden', s.h24);
    $('date').classList.toggle('hidden', !s.date);
    $('colon').classList.toggle('blink', s.blink);
  }
  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
  }

  let timer = null, lastMin = -1;
  function tick() {
    const now = new Date();
    let h = now.getHours();
    if (!s.h24) { $('ampm').textContent = h < 12 ? 'AM' : 'PM'; h = h % 12 || 12; }
    $('hh').textContent = s.h24 ? pad(h) : String(h);
    $('mm').textContent = pad(now.getMinutes());
    $('sec').textContent = pad(now.getSeconds());
    $('date').textContent = `${now.getMonth() + 1}月${now.getDate()}日（${WEEK[now.getDay()]}）`;
    if (now.getMinutes() !== lastMin) { lastMin = now.getMinutes(); applyStyle(now); shift(now); }
    clearTimeout(timer);
    timer = setTimeout(tick, 1000 - now.getMilliseconds() + 5);
  }

  // Burn-in protection: drift the clock a few pixels every minute
  function shift(now) {
    const m = now.getMinutes();
    const x = Math.round(Math.sin(m * 0.7) * 14);
    const y = Math.round(Math.cos(m * 0.5) * 10);
    $('clock').style.transform = `translate(${x}px, ${y}px)`;
  }

  // --- Keep the screen awake ---
  let lock = null;
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && !lock) {
        lock = await navigator.wakeLock.request('screen');
        lock.addEventListener('release', () => { lock = null; updateStatus(); });
      }
    } catch (e) { lock = null; }
    updateStatus();
  }
  function updateStatus() {
    $('status').textContent = !('wakeLock' in navigator)
      ? '画面スリープ防止：このブラウザでは使えません。iPadの「自動ロック」を「なし」にしてください。'
      : lock ? '画面スリープ防止：有効' : '画面スリープ防止：画面をタップすると有効になります';
    $('version').textContent = 'バージョン v' + VERSION;
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { keepAwake(); checkUpdate(); }
  });

  // --- Auto update: fetch the page bypassing cache, reload if VERSION changed ---
  async function checkUpdate() {
    try {
      const res = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return;
      const m = (await res.text()).match(/const VERSION = '([^']+)'/);
      if (m && m[1] !== VERSION) location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
    } catch (e) {}
  }
  setInterval(checkUpdate, 15 * 60 * 1000);

  // Manual update button: always reload past the cache
  $('update').addEventListener('click', async () => {
    const btn = $('update');
    btn.disabled = true; btn.textContent = '確認中…';
    let latest = VERSION;
    try {
      const res = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
      const m = (await res.text()).match(/const VERSION = '([^']+)'/);
      if (m) latest = m[1];
    } catch (e) {}
    btn.textContent = latest === VERSION ? '最新版です。再読み込みします…' : '新しい版があります。更新します…';
    setTimeout(() => location.replace(location.pathname + '?v=' + encodeURIComponent(latest) + '-' + Date.now()), 800);
  });

  // --- Settings panel ---
  const bind = (id, key, prop = 'checked') => {
    const el = $(id);
    el[prop] = s[key];
    el.addEventListener('input', () => { s[key] = el[prop]; save(); applyStyle(new Date()); tick(); });
  };
  bind('o24', 'h24'); bind('oSec', 'sec'); bind('oBlink', 'blink'); bind('oDate', 'date');
  bind('oWeight', 'weight', 'value'); bind('oNight', 'night');
  bind('oNightFrom', 'nightFrom', 'value'); bind('oNightTo', 'nightTo', 'value');
  const br = $('oBright'); br.value = s.bright;
  br.addEventListener('input', () => { s.bright = +br.value; save(); applyStyle(new Date()); });

  // A row of color swatches + free picker bound to s[key]; returns a function that re-syncs the selection
  function buildSwatches(boxId, key, groups) {
    const box = $(boxId), items = [], colors = groups.flat();
    const sync = () => {
      const preset = colors.includes(s[key]);
      items.forEach(([c, el]) => el.classList.toggle('on', c ? c === s[key] : !preset));
      cs.style.background = preset ? '' : s[key];
      ci.value = s[key];
    };
    const pick = c => { s[key] = c; save(); applyStyle(new Date()); sync(); };
    groups.forEach(group => {
      group.forEach(c => {
        const b = document.createElement('div');
        b.className = 'swatch'; b.style.background = c;
        b.addEventListener('click', () => pick(c));
        box.appendChild(b); items.push([c, b]);
      });
      const br = document.createElement('div'); br.className = 'break'; box.appendChild(br);
    });
    const cs = document.createElement('label');
    cs.className = 'swatch custom'; cs.title = '好きな色';
    const ci = document.createElement('input');
    ci.type = 'color';
    ci.addEventListener('input', () => pick(ci.value));
    cs.appendChild(ci); box.appendChild(cs); items.push([null, cs]);
    sync();
    return sync;
  }
  const syncFg = buildSwatches('swatches', 'color', COLORS);
  const syncBg = buildSwatches('bgSwatches', 'bg', BGS);

  // --- Random color combo with enough contrast to read the time ---
  const hsl2hex = (h, s, l) => {
    s /= 100; l /= 100;
    const f = n => { const k = (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
      return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))).toString(16).padStart(2, '0'); };
    return '#' + f(0) + f(8) + f(4);
  };
  const lum = hex => {
    const n = parseInt(hex.slice(1), 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255]
      .map(v => (v /= 255) <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4)
      .reduce((t, v, i) => t + v * [0.2126, 0.7152, 0.0722][i], 0);
  };
  const contrast = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
  const rnd = (a, b) => a + Math.random() * (b - a);
  // mode: 'dark' = dark background + light text, 'light' = the reverse, 'any' = either
  function randomColors(mode) {
    for (let i = 0; i < 50; i++) {
      const light = mode === 'light' || (mode === 'any' && Math.random() < 0.5);
      const bg = hsl2hex(rnd(0, 360), rnd(20, 80), light ? rnd(80, 96) : rnd(3, 18));
      const fg = hsl2hex(rnd(0, 360), rnd(40, 100), light ? rnd(10, 32) : rnd(65, 92));
      if (contrast(fg, bg) >= 7) { s.color = fg; s.bg = bg; break; }
    }
    save(); applyStyle(new Date()); syncFg(); syncBg();
  }
  document.querySelectorAll('[data-mode]').forEach(b =>
    b.addEventListener('click', () => randomColors(b.dataset.mode)));

  const fontEls = FONTS.map(([name, family], i) => {
    const b = document.createElement('div');
    b.className = 'font';
    b.innerHTML = `<b style='font-family:${family}'>12:34</b><small>${name}</small>`;
    b.addEventListener('click', () => pickFont(i));
    $('fonts').appendChild(b);
    return b;
  });
  function pickFont(i, scroll) {
    s.font = i; save(); applyStyle(new Date());
    fontEls.forEach((x, j) => x.classList.toggle('on', j === i));
    if (scroll) { const box = $('fonts'), el = fontEls[i]; box.scrollTop = el.offsetTop - box.offsetTop - box.clientHeight / 2 + el.offsetHeight / 2; }
  }
  fontEls.forEach((x, j) => x.classList.toggle('on', j === s.font));
  $('randomFont').addEventListener('click', () => {
    let i; do { i = Math.floor(Math.random() * FONTS.length); } while (i === s.font);
    pickFont(i, true);
  });

  $('stage').addEventListener('click', () => {
    keepAwake();
    setPanel($('panel').classList.contains('hidden'));
    $('hint').style.opacity = 0;
  });
  $('close').addEventListener('click', () => setPanel(false));
  // Open/close the panel; the clock shrinks into the space left of it while open
  function setPanel(open) {
    $('panel').classList.toggle('hidden', !open);
    document.body.classList.toggle('panel-open', open);
  }
  setTimeout(() => { $('hint').style.opacity = 0; }, 4000);

  const now = new Date();
  applyStyle(now); shift(now); tick(); keepAwake();
})();
</script>
</body>
</html>
